[project]
name = "comiccraft"
version = "1.0.0"
description = "AI-assisted comic story creator built with FastAPI, Gemini, and pluggable image generation"
requires-python = ">=3.11"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", "storage"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
